name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Flake check
        run: nix flake check --no-build
      - name: Go format & vet
        run: nix develop -c sh -c 'cd server && test -z "$(gofmt -l .)" && go vet ./...'
      - name: Build server and image
        run: |
          nix build .#sumomo
          nix build .#sumomo-image --no-link
