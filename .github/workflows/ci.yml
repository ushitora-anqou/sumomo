name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      # Load the dev shell (like direnv does locally) for the make targets.
      - uses: nicknovitski/nix-develop@9be7cfb4b10451d3390a75dc18ad0465bed4932a # v1
      - name: Flake check
        run: nix flake check --no-build
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Vet
        run: make vet
      - name: Build server package and image
        run: |
          nix build .#sumomo --no-link
          make build-image
