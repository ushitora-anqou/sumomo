name: Release image

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/ushitora-anqou/sumomo

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build images (amd64 + arm64 via nix cross)
        run: |
          nix build .#sumomo-image --print-out-paths --out-link image-amd64
          nix build .#sumomo-image-arm64 --print-out-paths --out-link image-arm64
      - name: Push multi-arch image
        run: |
          VERSION="${GITHUB_REF_NAME}"
          docker load < image-amd64
          docker load < image-arm64
          docker tag sumomo:latest        "$IMAGE:$VERSION-amd64"
          docker tag sumomo:latest-arm64  "$IMAGE:$VERSION-arm64"
          docker push "$IMAGE:$VERSION-amd64"
          docker push "$IMAGE:$VERSION-arm64"
          docker manifest create "$IMAGE:$VERSION" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker manifest create "$IMAGE:latest" \
            "$IMAGE:$VERSION-amd64" "$IMAGE:$VERSION-arm64"
          docker manifest push "$IMAGE:$VERSION"
          docker manifest push "$IMAGE:latest"
